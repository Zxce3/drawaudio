<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/icons/icon.svg" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#09090b" />
		<meta name="color-scheme" content="dark" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="DrawAudio" />
		<style>
			html, body { background: #09090b; }
			/* Loading screen: plain HTML/CSS so it paints before any JavaScript runs */
			#splash {
				position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
				align-items: center; justify-content: center; gap: 1.25rem; background: #09090b; color: #fafafa;
				font: 500 1rem/1.4 ui-sans-serif, system-ui, sans-serif; transition: opacity 0.35s ease;
			}
			.no-splash #splash { display: none; }
			#splash.hide { opacity: 0; pointer-events: none; }
			#splash .logo { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.02em; }
			#splash .logo b { color: #38bdf8; font-weight: 600; }
			#splash .bars { display: flex; align-items: flex-end; gap: 5px; height: 36px; }
			#splash .bars i { width: 6px; height: 100%; border-radius: 3px; background: #38bdf8; transform-origin: bottom; animation: splash-bar 1s ease-in-out infinite; }
			#splash .bars i:nth-child(2) { animation-delay: 0.12s; }
			#splash .bars i:nth-child(3) { animation-delay: 0.24s; }
			#splash .bars i:nth-child(4) { animation-delay: 0.36s; }
			#splash .bars i:nth-child(5) { animation-delay: 0.48s; }
			#splash .status { color: #a1a1aa; font-size: 0.85rem; min-height: 1.2em; }
			@keyframes splash-bar { 0%, 100% { transform: scaleY(0.25); opacity: 0.5; } 50% { transform: scaleY(1); opacity: 1; } }
			@media (prefers-reduced-motion: reduce) { #splash .bars i { animation: none; transform: scaleY(0.6); } #splash { transition: none; } }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="splash" role="status" aria-live="polite">
			<div class="logo">Draw<b>Audio</b></div>
			<div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
			<div class="status" id="splash-status">Loading…</div>
			<noscript>
				<style>#splash { display: none; }</style>
				<p style="position:fixed;top:0;left:0;right:0;z-index:101;margin:0;padding:.6rem 1rem;background:#18181b;color:#fafafa;font:.9rem/1.4 ui-sans-serif,system-ui,sans-serif;text-align:center">The DrawAudio editor needs JavaScript. You can still read about it and browse the example songs.</p>
			</noscript>
		</div>
		<script>
			// The loading screen is for the editor; content pages (like /examples/) render straight away
			if (/\/examples(\/|$)/.test(location.pathname)) document.documentElement.classList.add('no-splash');
			// If startup takes a while (slow network), say so instead of looking frozen
			setTimeout(function () {
				var s = document.getElementById('splash-status');
				if (s && document.getElementById('splash')) s.textContent = 'Still loading… this can take a moment on a slow connection.';
			}, 6000);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
